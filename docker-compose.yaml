# Testnet quickstart using the published image: `docker compose up`.
# Pin a release with `WALLET_BACKEND_VERSION=v1.0.0 docker compose up`.
# Build locally instead: `docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up --build`.
# Mainnet needs NETWORK_PASSPHRASE, ARCHIVE_URL, and an RPC or datastore on pubnet.
# See docs/operations/running.md.
name: wallet-backend

x-wallet-backend-env: &wallet-backend-env
  DATABASE_URL: postgres://postgres@db:5432/wallet-backend?sslmode=disable
  RPC_URL: http://stellar-rpc:8000
  NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"

services:
  db:
    image: timescale/timescaledb:2.28.2-pg17
    command: ["postgres", "-c", "timescaledb.enable_chunk_skipping=on", "-c", "timescaledb.enable_sparse_index_bloom=on"]
    environment:
      # Passwordless auth is for local use only.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: wallet-backend
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet-backend"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  stellar-rpc:
    image: stellar/stellar-rpc:stable
    entrypoint: ["/bin/bash", "/config/stellar_rpc_startup.sh"]
    environment:
      NETWORK: testnet
    volumes:
      - ./config:/config:ro
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST localhost:8000 -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' | grep -q '\"status\":\"healthy\"'"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 10s

  migrate:
    image: stellar/wallet-backend:${WALLET_BACKEND_VERSION:-latest}
    command: ["migrate", "up"]
    environment:
      <<: *wallet-backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  ingest:
    image: stellar/wallet-backend:${WALLET_BACKEND_VERSION:-latest}
    command: ["ingest"]
    environment:
      <<: *wallet-backend-env
      LEDGER_BACKEND_TYPE: rpc
      INGEST_SERVER_PORT: 8002
    ports:
      - 8002:8002
    depends_on:
      migrate:
        condition: service_completed_successfully
      stellar-rpc:
        condition: service_healthy

  api:
    image: stellar/wallet-backend:${WALLET_BACKEND_VERSION:-latest}
    command: ["serve"]
    environment:
      <<: *wallet-backend-env
      PORT: 8001
      GRAPHQL_INTROSPECTION_ENABLED: "true"
      CLIENT_AUTH_PUBLIC_KEYS: ${CLIENT_AUTH_PUBLIC_KEYS:-}
    ports:
      - 8001:8001
    depends_on:
      migrate:
        condition: service_completed_successfully
      stellar-rpc:
        condition: service_healthy

volumes:
  db-data:

configs:
  postgres_init:
    content: |
      CREATE EXTENSION IF NOT EXISTS timescaledb;
