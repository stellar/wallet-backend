# ABOUTME: Promotes a prerelease image from staging ECR to production ECR, public ECR and Docker Hub by re-tagging
# ABOUTME: (no rebuild, same digest everywhere) and creates a non-prerelease GitHub release.
name: Promote Release

on:
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: "Prerelease tag to promote (e.g., v1.2.3-rc.1)"
        required: true
        type: string
      release_version:
        description: "Release version to publish (e.g., v1.2.3)"
        required: true
        type: string

env:
  # Versions listed under "Tested with" in the release notes.
  PG_MAJOR: "17"
  TSDB_VERSION: "2.28.2"
  # Public image, created by Terraform in stellar/terraform (aws/sdf/ecr/public_repos.auto.tfvars.json).
  PUBLIC_IMAGE: public.ecr.aws/stellar/wallet-backend
  # Docker Hub is kept for existing users until it is deprecated. Public ECR is the primary registry.
  DOCKERHUB_IMAGE: docker.io/stellar/wallet-backend

permissions:
  id-token: write
  contents: write

concurrency:
  # One promotion at a time. Together with the :latest ordering check below, :latest never moves backwards.
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input formats and base-version match
        env:
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ ! "$PRERELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "::error::Invalid prerelease_tag '$PRERELEASE_TAG'. Expected vMAJOR.MINOR.PATCH-rc.N."
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release_version '$RELEASE_VERSION'. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi
          BASE="${PRERELEASE_TAG%-rc.*}"
          if [[ "$BASE" != "$RELEASE_VERSION" ]]; then
            echo "::error::Base version mismatch: prerelease '$PRERELEASE_TAG' (base: $BASE) does not match release '$RELEASE_VERSION'."
            exit 1
          fi
          echo "Inputs OK: $PRERELEASE_TAG -> $RELEASE_VERSION"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify prerelease GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
        run: |
          if ! IS_PRE=$(gh release view "$PRERELEASE_TAG" --json isPrerelease --jq '.isPrerelease' 2>/dev/null); then
            echo "::error::GitHub release '$PRERELEASE_TAG' not found."
            exit 1
          fi
          if [[ "$IS_PRE" != "true" ]]; then
            echo "::error::GitHub release '$PRERELEASE_TAG' exists but is not a prerelease."
            exit 1
          fi

      - name: Verify release_version does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::GitHub release '$RELEASE_VERSION' already exists."
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$RELEASE_VERSION" | grep -q .; then
            echo "::error::Tag '$RELEASE_VERSION' already exists on origin."
            exit 1
          fi
          echo "Release version '$RELEASE_VERSION' is available."

      - name: Resolve commit SHA from prerelease tag
        id: resolve_sha
        env:
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
        run: |
          SHA=$(git rev-list -n1 "$PRERELEASE_TAG")
          if [[ -z "$SHA" ]]; then
            echo "::error::Could not resolve commit SHA for tag '$PRERELEASE_TAG'."
            exit 1
          fi
          echo "Tag $PRERELEASE_TAG -> $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: ECR login via OIDC
        id: ecr_login
        uses: stellar/actions/sdf-ecr-login@main
        with:
          login-public-ecr: 'true'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # :latest follows the highest released version. Promoting an older version later (a patch for a
      # previous line) publishes its tag without touching :latest.
      - name: Decide whether this release moves :latest
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          # A failed gh call stops the step; only an empty list means no releases yet.
          TAGS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name')
          HIGHEST=$({ grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$TAGS" || true; } | sort -V | tail -1)
          if [[ -z "$HIGHEST" || "$(printf '%s\n%s\n' "$HIGHEST" "$RELEASE_VERSION" | sort -V | tail -1)" == "$RELEASE_VERSION" ]]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
            echo "$RELEASE_VERSION is the highest release; :latest will move."
          else
            echo "move=false" >> "$GITHUB_OUTPUT"
            echo "$HIGHEST is newer than $RELEASE_VERSION; :latest stays put."
          fi

      - name: Resolve staging digest
        id: stg
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.ecr-registry }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "${ECR_REGISTRY}/stg/wallet-backend:${PRERELEASE_TAG}" --format '{{.Manifest.Digest}}')
          echo "Staging digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Every check runs before any tag is created. A tag that already holds the staging digest is left from an
      # earlier partial run and is accepted, so a failed promotion can be re-run.
      - name: Verify production ECR tag is absent or already promoted
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          STG_DIGEST: ${{ steps.stg.outputs.digest }}
        run: |
          set -uo pipefail
          # Fail closed: only ImageNotFoundException or a matching digest lets the promotion proceed.
          if out=$(aws ecr describe-images --repository-name prd/wallet-backend --image-ids imageTag="$RELEASE_VERSION" --region us-east-1 --query 'imageDetails[0].imageDigest' --output text 2>&1); then
            if [[ "$out" == "$STG_DIGEST" ]]; then
              echo "ECR tag $RELEASE_VERSION already holds $STG_DIGEST. Proceeding."
              exit 0
            fi
            echo "::error::ECR tag prd/wallet-backend:$RELEASE_VERSION already exists with digest $out, not $STG_DIGEST."
            exit 1
          fi
          if ! grep -q "ImageNotFoundException" <<<"$out"; then
            echo "::error::Could not verify ECR tag prd/wallet-backend:$RELEASE_VERSION: $out"
            exit 1
          fi
          echo "ECR tag $RELEASE_VERSION not present. Proceeding."

      - name: Verify public ECR tag is absent or already published
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          STG_DIGEST: ${{ steps.stg.outputs.digest }}
        run: |
          set -uo pipefail
          # Fail closed: only an explicit not-found answer or a matching digest lets the publish proceed.
          if out=$(docker buildx imagetools inspect "${PUBLIC_IMAGE}:${RELEASE_VERSION}" --format '{{.Manifest.Digest}}' 2>&1); then
            if [[ "$out" == "$STG_DIGEST" ]]; then
              echo "Public ECR tag ${RELEASE_VERSION} already holds $STG_DIGEST. Proceeding."
              exit 0
            fi
            echo "::error::Public ECR tag ${PUBLIC_IMAGE}:${RELEASE_VERSION} already exists with digest $out, not $STG_DIGEST."
            exit 1
          fi
          if ! grep -qiE "not found|no such manifest|manifest unknown|MANIFEST_UNKNOWN" <<<"$out"; then
            echo "::error::Could not verify public ECR tag ${RELEASE_VERSION}: $out"
            exit 1
          fi
          echo "Public ECR tag ${RELEASE_VERSION} not present. Proceeding."

      # Cross-registry copy of the production ECR digest; no rebuild.
      - name: Verify Docker Hub tag is absent or already published
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          STG_DIGEST: ${{ steps.stg.outputs.digest }}
        run: |
          set -uo pipefail
          # Fail closed: only an explicit not-found answer or a matching digest lets the publish proceed.
          if out=$(docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${RELEASE_VERSION}" --format '{{.Manifest.Digest}}' 2>&1); then
            if [[ "$out" == "$STG_DIGEST" ]]; then
              echo "Docker Hub tag ${RELEASE_VERSION} already holds $STG_DIGEST. Proceeding."
              exit 0
            fi
            echo "::error::Docker Hub tag ${DOCKERHUB_IMAGE}:${RELEASE_VERSION} already exists with digest $out, not $STG_DIGEST."
            exit 1
          fi
          if ! grep -qiE "not found|no such manifest|manifest unknown|MANIFEST_UNKNOWN" <<<"$out"; then
            echo "::error::Could not verify Docker Hub tag ${RELEASE_VERSION}: $out"
            exit 1
          fi
          echo "Docker Hub tag ${RELEASE_VERSION} not present. Proceeding."

      # Same digest as production and public ECR; no rebuild.
      - name: Re-tag image from staging to production ECR
        id: retag
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.ecr-registry }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          STG_TAG="${ECR_REGISTRY}/stg/wallet-backend:${PRERELEASE_TAG}"
          PRD_TAG="${ECR_REGISTRY}/prd/wallet-backend:${RELEASE_VERSION}"
          echo "Re-tagging $STG_TAG -> $PRD_TAG"
          docker buildx imagetools create --prefer-index=false --tag "$PRD_TAG" "$STG_TAG"
          echo "Verifying digests match..."
          STG_DIGEST=$(docker buildx imagetools inspect "$STG_TAG" --format '{{.Manifest.Digest}}')
          PRD_DIGEST=$(docker buildx imagetools inspect "$PRD_TAG" --format '{{.Manifest.Digest}}')
          echo "STG digest: $STG_DIGEST"
          echo "PRD digest: $PRD_DIGEST"
          if [[ "$STG_DIGEST" != "$PRD_DIGEST" ]]; then
            echo "::error::Digest mismatch after re-tag: '$STG_DIGEST' vs '$PRD_DIGEST'."
            exit 1
          fi
          echo "Promotion successful — bytes preserved."
          echo "prd_tag=$PRD_TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$PRD_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Publish to public ECR
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          PRD_TAG: ${{ steps.retag.outputs.prd_tag }}
          PRD_DIGEST: ${{ steps.retag.outputs.digest }}
          MOVE_LATEST: ${{ steps.latest.outputs.move }}
        run: |
          set -euo pipefail
          echo "Copying $PRD_TAG -> ${PUBLIC_IMAGE}:${RELEASE_VERSION} (move latest: $MOVE_LATEST)"
          LATEST_ARG=()
          if [[ "$MOVE_LATEST" == "true" ]]; then LATEST_ARG=(--tag "${PUBLIC_IMAGE}:latest"); fi
          docker buildx imagetools create --prefer-index=false \
            --tag "${PUBLIC_IMAGE}:${RELEASE_VERSION}" "${LATEST_ARG[@]}" \
            "$PRD_TAG"
          PUBLIC_DIGEST=$(docker buildx imagetools inspect "${PUBLIC_IMAGE}:${RELEASE_VERSION}" --format '{{.Manifest.Digest}}')
          echo "PRD digest: $PRD_DIGEST"
          echo "Public ECR digest: $PUBLIC_DIGEST"
          if [[ "$PUBLIC_DIGEST" != "$PRD_DIGEST" ]]; then
            echo "::error::Digest mismatch after public ECR copy: '$PRD_DIGEST' vs '$PUBLIC_DIGEST'."
            exit 1
          fi
          echo "Public ECR publish successful, bytes preserved."

      - name: Publish to Docker Hub
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          PRD_TAG: ${{ steps.retag.outputs.prd_tag }}
          PRD_DIGEST: ${{ steps.retag.outputs.digest }}
          MOVE_LATEST: ${{ steps.latest.outputs.move }}
        run: |
          set -euo pipefail
          echo "Copying $PRD_TAG -> ${DOCKERHUB_IMAGE}:${RELEASE_VERSION} (move latest: $MOVE_LATEST)"
          LATEST_ARG=()
          if [[ "$MOVE_LATEST" == "true" ]]; then LATEST_ARG=(--tag "${DOCKERHUB_IMAGE}:latest"); fi
          docker buildx imagetools create --prefer-index=false \
            --tag "${DOCKERHUB_IMAGE}:${RELEASE_VERSION}" "${LATEST_ARG[@]}" \
            "$PRD_TAG"
          HUB_DIGEST=$(docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${RELEASE_VERSION}" --format '{{.Manifest.Digest}}')
          echo "PRD digest: $PRD_DIGEST"
          echo "Docker Hub digest: $HUB_DIGEST"
          if [[ "$HUB_DIGEST" != "$PRD_DIGEST" ]]; then
            echo "::error::Digest mismatch after Docker Hub copy: '$PRD_DIGEST' vs '$HUB_DIGEST'."
            exit 1
          fi
          echo "Docker Hub publish successful, bytes preserved."

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          COMMIT_SHA: ${{ steps.resolve_sha.outputs.sha }}
        run: |
          set -euo pipefail
          # Generated notes are appended after --notes. The maintainer fills the
          # <fill in> placeholders by editing the release after promotion.
          NOTES=$(cat <<EOF
          ## Images
          - \`docker pull public.ecr.aws/stellar/wallet-backend:${RELEASE_VERSION}\`
          - \`docker pull stellar/wallet-backend:${RELEASE_VERSION}\` (Docker Hub, kept for existing users)

          ## Tested with
          - stellar-rpc: <fill in>
          - Stellar protocol: <fill in>
          - PostgreSQL: ${PG_MAJOR}
          - TimescaleDB: ${TSDB_VERSION}
          EOF
          )
          gh release create "$RELEASE_VERSION" \
            --target "$COMMIT_SHA" \
            --title "$RELEASE_VERSION" \
            --notes "$NOTES" \
            --generate-notes
